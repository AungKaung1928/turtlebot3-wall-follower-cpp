wall_follower_controller:
  ros__parameters:
    use_sim_time: true

    # Control
    desired_distance: 0.5           # Target distance from wall (m)
    forward_speed: 0.18             # Normal forward speed (m/s)
    search_speed: 0.12              # Speed while searching / rounding an outside corner (m/s)
    max_angular_speed: 1.0          # Maximum rotation speed (rad/s)
    control_frequency: 20.0         # Control loop rate (Hz)

    # PD gains. The derivative divides by dt, so it is 1/dt times more sensitive than the
    # proportional term; it is EMA-filtered in the node. Keep kd modest.
    kp: 2.0
    kd: 0.6
    # Two-beam wall estimate: side beam plus one swung beam_spread_deg forward. The error is the
    # wall distance predicted lookahead_distance ahead, so a converging heading is corrected early.
    lookahead_distance: 0.3
    beam_spread_deg: 40.0

    # Safety distances (m). Must satisfy side_clearance < wall_min < desired < wall_lost
    # and emergency_stop < slow_down.
    emergency_stop_distance: 0.35
    slow_down_distance: 0.80
    wall_min_distance: 0.28
    wall_lost_distance: 1.2
    side_clearance: 0.25

    # Behaviour
    search_period_cycles: 60        # Cycles before reversing the search sweep direction
    stuck_threshold_cycles: 3       # x20 cycles in AVOIDING before backing off
